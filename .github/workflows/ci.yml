name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-none,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just format
      - name: Check no formatting changes
        run: git diff --exit-code
      - run: just lint
      - run: just test
      - name: Build init
        run: cd init && cargo build --release --target aarch64-unknown-none
      - name: Build runner-js
        run: cd runner-js && cargo build --target aarch64-unknown-linux-musl --release

  linux-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl,aarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Install cross-compilation toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Lint (KVM backend)
        run: cargo clippy -p convex-hypervisor -p convex-shared --target aarch64-unknown-linux-gnu -- -D warnings
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Build host (KVM backend)
        run: cargo build -p convex-hypervisor -p convex-shared --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Build init
        run: cd init && cargo build --release --target aarch64-unknown-none
      - name: Build runner-js
        run: cd runner-js && cargo build --target aarch64-unknown-linux-musl --release
