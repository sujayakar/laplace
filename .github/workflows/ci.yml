name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-none,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting (workspace)
        run: cargo fmt --all -- --check
      - name: Check formatting (excluded crates)
        run: |
          for crate in guest init runner-js runner-v8; do
            echo "Checking $crate..."
            cargo fmt --manifest-path "$crate/Cargo.toml" -- --check
          done
      - run: cargo clippy -p convex-hypervisor -p convex-shared -- -D warnings

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build -p convex-hypervisor -p convex-shared
      - name: Build init
        run: cd init && cargo build --release --target aarch64-unknown-none
      - name: Build runner-js
        run: cd runner-js && cargo build --target aarch64-unknown-linux-musl --release
      - name: Unit tests
        run: cargo test -p convex-hypervisor -p convex-shared

  linux-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl,aarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build host (KVM backend)
        run: cargo build -p convex-hypervisor -p convex-shared --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Build init
        run: cd init && cargo build --release --target aarch64-unknown-none
      - name: Build runner-js
        run: cd runner-js && cargo build --target aarch64-unknown-linux-musl --release
